<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- 3D Gold Ball Gradient -->
    <radialGradient id="snitchGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff066" />
      <stop offset="60%" stop-color="#ffd700" />
      <stop offset="85%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#5c4002" />
    </radialGradient>
    
    <!-- Gossamer Wings Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="50%" stop-color="rgba(255, 240, 160, 0.7)" />
      <stop offset="100%" stop-color="rgba(218, 165, 32, 0.3)" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Wing (Pointed toward top-left action point) -->
  <path d="M12 14 C9 6, 4 3, 2 2 C1 6, 5 11, 10 16 Z" fill="url(#wingGrad)" stroke="#ffd700" stroke-width="0.75" />
  <path d="M11 13 C8 8, 5 5, 3 3" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.8" />

  <!-- Right Wing -->
  <path d="M20 14 C23 6, 28 3, 30 2 C31 6, 27 11, 22 16 Z" fill="url(#wingGrad)" stroke="#ffd700" stroke-width="0.75" />
  <path d="M21 13 C24 8, 27 5, 29 3" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.8" />

  <!-- The Golden Snitch Sphere -->
  <circle cx="16" cy="17" r="7" fill="url(#snitchGold)" stroke="#ffd700" stroke-width="0.75" filter="url(#goldGlow)" />

  <!-- Ball Runic Seams & Grooves -->
  <path d="M11.5 15 C13.5 18, 18.5 18, 20.5 15" fill="none" stroke="#8c6200" stroke-width="0.75" stroke-linecap="round" />
  <path d="M11.5 19 C13.5 16, 18.5 16, 20.5 19" fill="none" stroke="#8c6200" stroke-width="0.75" stroke-linecap="round" />

  <!-- Precision Click Hotspot Sparkle at (2, 2) -->
  <polygon points="2,0 3,2 5,2 3.5,3.5 4,5.5 2,4 0,5.5 0.5,3.5 -1,2 1,2" fill="#ffffff" transform="translate(1, 1)" />
</svg>

